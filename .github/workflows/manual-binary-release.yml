name: Manual Binary Release (按需编译)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签；不存在时自动创建 (例如 v1.6.0)'
        required: true
        default: 'v1.14.0'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      ASSET_NAME: prismcat-${{ inputs.tag_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            suffix: .exe

    steps:
      - name: 校验版本标签
        shell: bash
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "版本标签必须符合 v0.0.1 或 v0.0.1-rc.1 格式" >&2
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 编译前端 UI
        run: |
          cd web
          npm ci
          npm run build
          # 将编译结果同步到 Go 嵌入目录
          mkdir -p ../internal/server/ui
          find ../internal/server/ui -mindepth 1 ! -name README.md -exec rm -rf {} +
          cp -r dist/* ../internal/server/ui/

      - name: 设置 Go 环境
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.7' # 对应 go.mod 里的版本

      - name: 交叉编译二进制文件
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0 # 关键：关闭 CGO 使二进制文件在 Linux/macOS 上具备极致的便携性
        run: |
          VERSION="${TAG_NAME#v}"
          go build -ldflags="-s -w -X github.com/paopaoandlingyia/PrismCat/internal/config.Version=${VERSION}" -o "${ASSET_NAME}" ./cmd/prismcat

      - name: 保存编译产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: 创建或更新 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载全部编译产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建 Release 或覆盖附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          mapfile -t ASSETS < <(find release-assets -maxdepth 1 -type f -print | sort)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "没有找到可发布的编译产物" >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "$TAG_NAME" \
              --generate-notes
          fi
